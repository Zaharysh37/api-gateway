server.port=${APP_PORT:8084}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service-app:8082/api/auth/.well-known/jwks.json

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://authservice-app:8082

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://userservice-app:8081

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://orderservice-app:8083