services:
  postgres-user-db:
    image: postgres:15-alpine
    container_name: user-service-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_HOST_PORT}:5432"

  postgres-auth-db:
    image: postgres:15-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_HOST_PORT}:5432"

  postgres-order-db:
    image: postgres:15-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_HOST_PORT}:5432"

  redis-cache:
    image: redis:7.2-alpine
    container_name: user-service-redis
    ports:
      - "${REDIS_PORT}:6379"

  authservice-app:
    container_name: auth-service-app
    build:
      context: ./../authservice
      dockerfile: Dockerfile
    ports:
      - "${AUTH_APP_PORT}:${AUTH_APP_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_APP_PORT: ${AUTH_APP_PORT}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      SPRING_AUTH_DATASOURCE_USERNAME: ${SPRING_AUTH_DATASOURCE_USERNAME}
      SPRING_AUTH_DATASOURCE_PASSWORD: ${SPRING_AUTH_DATASOURCE_PASSWORD}
    depends_on:
      postgres-auth-db:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_APP_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  userservice-app:
    container_name: user-service-app
    build:
      context: ./../userservice
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: ${APP_PORT}
      DB_NAME: ${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    depends_on:
      postgres-user-db:
        condition: service_started
      redis-cache:
        condition: service_started
      authservice-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${USER_APP_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  orderservice-app:
    container_name: order-service-app
    build:
      context: ./../orderservice
      dockerfile: Dockerfile
    ports:
      - "${ORDER_APP_PORT}:${ORDER_APP_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ORDER_APP_PORT: ${ORDER_APP_PORT}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      SPRING_ORDER_DATASOURCE_USERNAME: ${SPRING_ORDER_DATASOURCE_USERNAME}
      SPRING_ORDER_DATASOURCE_PASSWORD: ${SPRING_ORDER_DATASOURCE_PASSWORD}
    depends_on:
      postgres-order-db:
        condition: service_started
      authservice-app:
        condition: service_healthy
      userservice-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ORDER_APP_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  apigateway-app:
    container_name: api-gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://authservice-app:${AUTH_APP_PORT}
      USER_SERVICE_URL: http://userservice-app:${USER_APP_PORT}
      INTERNAL_API_KEY: ${ROLLBACK_KEY}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authservice-app:${AUTH_APP_PORT}/api/auth/.well-known/jwks.json
    depends_on:
      authservice-app:
        condition: service_healthy
      userservice-app:
        condition: service_healthy
      orderservice-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GATEWAY_APP_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s