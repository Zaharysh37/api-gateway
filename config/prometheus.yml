global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['userservice-app:8081', 'authservice-app:8082', 'orderservice-app:8083', 'paymentservice-app:8085', 'apigateway-app:8084']
        labels:
          application: 'microservices-system'